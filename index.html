<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montanha Lanches | Sabor que escala.</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (Pinned versions) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0F0F0F',         /* Fundo quase preto */
              surface: '#1A1A1A',    /* Fundo de cards/sections */
              fg: '#F5F5F5',         /* Texto principal */
              muted: '#737373',      /* Texto secundário */
              primary: '#C0392B',    /* Vermelho intenso */
              accent: '#E67E22',     /* Laranja quente */
            }
          },
          fontFamily: {
            display: ['Anton', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-bg: #0F0F0F;
      --brand-surface: #1A1A1A;
      --brand-fg: #F5F5F5;
      --brand-muted: #737373;
      --brand-primary: #C0392B;
      --brand-accent: #E67E22;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--brand-bg);
      color: var(--brand-fg);
      margin: 0;
      overflow-x: hidden;
    }


    /* ── Scroll progress bar ── */
    #scroll-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0%;
      background: var(--brand-primary);
      z-index: 10000;
      transition: width 0.08s linear;
    }

    /* ── Cursor spotlight ── */
    #cursor-spotlight {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(500px at 50% 50%, rgba(192,57,43,0.06), transparent 70%);
    }


    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--brand-bg); border-left: 2px solid #333; }
    ::-webkit-scrollbar-thumb { background: var(--brand-primary); border-left: 2px solid #333; }

    /* ── Menu card 3D tilt ── */
    .menu-card { transform-style: preserve-3d; will-change: transform; }

    /* ── Carousel zoom (Ken Burns) ── */
    @keyframes kenburns {
      0%   { opacity: 0; transform: scale(1.0); }
      10%  { opacity: 1; transform: scale(1.01); }
      100% { opacity: 1; transform: scale(1.10); }
    }
    .carousel-img {
      width: 100%; height: 100%;
      object-fit: cover;
      animation: kenburns 6s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="scroll-progress"></div>
  <div id="cursor-spotlight"></div>
  <div id="root"></div>

  <!-- Load separated components via Babel -->
  <script type="text/babel" src="components/ThreeBackground.tsx"></script>
  <script type="text/babel" src="components/Hero.tsx"></script>
  <script type="text/babel" src="components/About.tsx"></script>
  <script type="text/babel" src="components/Menu.tsx"></script>
  <script type="text/babel" src="components/Horarios.tsx"></script>
  <script type="text/babel" src="components/Mapa.tsx"></script>
  <script type="text/babel" src="components/App.tsx"></script>

  <!-- Global interaction effects -->
  <script>
    (function () {
      const spotlight   = document.getElementById('cursor-spotlight');
      const progressBar = document.getElementById('scroll-progress');

      document.addEventListener('mousemove', (e) => {
        spotlight.style.background =
          `radial-gradient(500px at ${e.clientX}px ${e.clientY}px, rgba(192,57,43,0.07), transparent 70%)`;
      });

      window.addEventListener('scroll', () => {
        const pct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight) * 100;
        progressBar.style.width = pct + '%';
      }, { passive: true });
    })();
  </script>

  <!-- Render App -->
  <script type="text/babel">
    const checkApp = setInterval(() => {
      if (window.App) {
        clearInterval(checkApp);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<window.App />);
      }
    }, 50);
  </script>
</body>
</html>
