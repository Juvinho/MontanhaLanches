<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Animation Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: rgba(26, 26, 26, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: monospace;
      padding-bottom: 64px;
    }

    #burger-canvas {
      display: block;
      width: 70vw;
      height: 80vh;
    }

    @media (max-width: 768px) {
      #burger-canvas {
        width: 100vw;
        height: 60vh;
      }
    }

    #debug {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: rgba(180, 180, 180, 1);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 2;
      pointer-events: none;
      z-index: 10;
    }

    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 15, 0.95);
      border-top: 1px solid rgba(80, 80, 80, 0.5);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      align-items: center;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(200, 200, 200, 1);
      font-size: 12px;
    }

    .ctrl label {
      min-width: 72px;
    }

    .ctrl input[type="range"] {
      width: 110px;
      accent-color: rgba(180, 40, 30, 1);
    }

    .ctrl span {
      min-width: 38px;
      text-align: right;
      color: rgba(160, 160, 160, 1);
    }

    button {
      padding: 5px 12px;
      font-size: 12px;
      font-family: monospace;
      cursor: pointer;
      background: rgba(35, 35, 35, 1);
      color: rgba(200, 200, 200, 1);
      border: 1px solid rgba(90, 90, 90, 1);
    }

    button:hover {
      background: rgba(55, 55, 55, 1);
    }

    .btn-active {
      border-color: rgba(68, 255, 68, 0.8) !important;
      color: rgba(68, 255, 68, 1) !important;
    }
  </style>
</head>
<body>
  <canvas id="burger-canvas"></canvas>

  <div id="debug">
    FPS: <span id="d-fps">—</span><br>
    Ângulo: <span id="d-angle">0</span>°<br>
    Camadas: <span id="d-layers">7</span>
  </div>

  <div id="controls">
    <div class="ctrl">
      <label>Velocidade</label>
      <input type="range" id="s-speed" min="0.001" max="0.03" step="0.001" value="0.008">
      <span id="v-speed">0.008</span>
    </div>
    <div class="ctrl">
      <label>Escala</label>
      <input type="range" id="s-scale" min="0.15" max="0.45" step="0.01" value="0.38">
      <span id="v-scale">0.38</span>
    </div>
    <div class="ctrl">
      <label>Opacidade</label>
      <input type="range" id="s-opacity" min="0.1" max="1.0" step="0.05" value="0.55">
      <span id="v-opacity">0.55</span>
    </div>
    <div class="ctrl">
      <label>FOV</label>
      <input type="range" id="s-fov" min="2" max="8" step="0.1" value="4">
      <span id="v-fov">4.0</span>
    </div>
    <button id="btn-pause">Pausar</button>
    <button id="btn-reset">Resetar</button>
    <button id="btn-axes">Eixos XYZ</button>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('burger-canvas');
      const ctx    = canvas.getContext('2d');

      let angle    = 0;
      let paused   = false;
      let showAxes = false;
      let lastTime = 0;
      let fps      = 0;

      const DEFAULTS = { speed: 0.008, scale: 0.38, opacity: 0.55, fov: 4 };
      let speed   = DEFAULTS.speed;
      let scale   = DEFAULTS.scale;
      let opacity = DEFAULTS.opacity;
      let fov     = DEFAULTS.fov;

      const SLICES = 20;

      // Pão superior — superfície de revolução
      const bunTopProfile = [
        [ -0.88,  0.01 ],
        [ -0.76,  0.24 ],
        [ -0.62,  0.52 ],
        [ -0.48,  0.70 ],
        [ -0.36,  0.76 ],
        [ -0.28,  0.76 ],
        [ -0.22,  0.72 ],
        [ -0.18,  0.75 ],  // lábio
        [ -0.14,  0.50 ],  // aba cai
        [ -0.11,  0.46 ],  // base da aba
      ];

      // Pão inferior — superfície de revolução (achatada)
      const bunBotProfile = [
        [  0.20,  0.46 ],  // base da aba inferior
        [  0.23,  0.50 ],
        [  0.27,  0.72 ],  // lábio
        [  0.30,  0.73 ],
        [  0.34,  0.68 ],
        [  0.39,  0.42 ],
        [  0.43,  0.16 ],
        [  0.45,  0.01 ],
      ];

      // Ingredientes — camadas independentes
      // { y0: topo, y1: base, r, segs, wave, square, spokes, o: opacidade, w: lineWidth }
      const ingredients = [
        { y0: -0.09, y1: -0.06, r: 0.82, segs: 18, wave: true,  square: false, spokes: 0, o: 0.85, w: 1.5 },  // alface
        { y0: -0.04, y1: -0.01, r: 0.71, segs:  4, wave: false, square: true,  spokes: 4, o: 0.80, w: 1.6 },  // queijo
        { y0:  0.02, y1:  0.11, r: 0.64, segs: 24, wave: false, square: false, spokes: 8, o: 0.60, w: 1.3 },  // carne
        { y0:  0.14, y1:  0.17, r: 0.68, segs: 24, wave: false, square: false, spokes: 8, o: 0.65, w: 1.1 },  // tomate
      ];

      document.getElementById('d-layers').textContent = ingredients.length;

      function resize() {
        canvas.width  = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function project(x, y, z, cx, cy, sc, fv, ang) {
        const cosA = Math.cos(ang);
        const sinA = Math.sin(ang);
        const rx   = x * cosA - z * sinA;
        const rz   = x * sinA + z * cosA;
        const p    = fv / (fv + rz);
        return {
          x: cx + rx * sc * p,
          y: cy + y  * sc * p,
          z: rz,
          p: p,
        };
      }

      function circlePoints(r, y, segs, wave, square) {
        const pts = [];
        for (let i = 0; i < segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          let radius = r;
          if (wave) radius += Math.sin(a * 6) * 0.06;
          if (square) {
            const lim = r * 0.88;
            pts.push([Math.max(-lim, Math.min(lim, Math.cos(a) * radius)), y, Math.max(-lim, Math.min(lim, Math.sin(a) * radius))]);
          } else {
            pts.push([Math.cos(a) * radius, y, Math.sin(a) * radius]);
          }
        }
        return pts;
      }

      function drawRevolution(prof, cx, cy, sc, o) {
        // meridians
        for (let s = 0; s < SLICES; s++) {
          const a = (s / SLICES) * Math.PI * 2;
          ctx.beginPath();
          prof.forEach(([y, r], i) => {
            const p = project(Math.cos(a) * r, y, Math.sin(a) * r, cx, cy, sc, fov, angle);
            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * o})`;
          ctx.lineWidth   = 1.0;
          ctx.stroke();
        }
        // parallels
        prof.forEach(([y, r]) => {
          if (r < 0.02) return;
          ctx.beginPath();
          for (let s = 0; s <= SLICES; s++) {
            const a = (s / SLICES) * Math.PI * 2;
            const p = project(Math.cos(a) * r, y, Math.sin(a) * r, cx, cy, sc, fov, angle);
            s === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * o * 0.65})`;
          ctx.lineWidth   = 0.9;
          ctx.stroke();
        });
      }

      function drawIngredient(ing, cx, cy, sc) {
        const topPts  = circlePoints(ing.r, ing.y0, ing.segs, ing.wave, ing.square);
        const botPts  = circlePoints(ing.r, ing.y1, ing.segs, false,    ing.square);
        const topProj = topPts.map(([x, y, z]) => project(x, y, z, cx, cy, sc, fov, angle));
        const botProj = botPts.map(([x, y, z]) => project(x, y, z, cx, cy, sc, fov, angle));

        // top ring
        ctx.beginPath();
        topProj.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * ing.o})`;
        ctx.lineWidth   = ing.w;
        ctx.stroke();

        // bottom ring
        ctx.beginPath();
        botProj.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * ing.o * 0.65})`;
        ctx.lineWidth   = ing.w * 0.75;
        ctx.stroke();

        // vertical connections
        const vstep = Math.max(1, Math.floor(ing.segs / 8));
        for (let s = 0; s < ing.segs; s += vstep) {
          ctx.beginPath();
          ctx.moveTo(topProj[s].x, topProj[s].y);
          ctx.lineTo(botProj[s].x, botProj[s].y);
          ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * ing.o * 0.45})`;
          ctx.lineWidth   = ing.w * 0.55;
          ctx.stroke();
        }

        // radial spokes on top
        if (ing.spokes > 0) {
          const center   = project(0, ing.y0, 0, cx, cy, sc, fov, angle);
          const sstep    = Math.floor(ing.segs / ing.spokes);
          for (let s = 0; s < ing.segs; s += sstep) {
            ctx.beginPath();
            ctx.moveTo(center.x, center.y);
            ctx.lineTo(topProj[s].x, topProj[s].y);
            ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * ing.o * 0.20})`;
            ctx.lineWidth   = 0.6;
            ctx.stroke();
          }
        }
      }

      function drawAxes(cx, cy, sc) {
        const lines = [
          { a: project(-1, 0, 0, cx, cy, sc, fov, angle), b: project(1, 0, 0, cx, cy, sc, fov, angle), color: 'rgba(255, 68, 68, 1)' },
          { a: { x: cx, y: cy - sc * 0.8 },               b: { x: cx, y: cy + sc * 0.8 },              color: 'rgba(68, 255, 68, 1)' },
          { a: project(0, 0, -1, cx, cy, sc, fov, angle), b: project(0, 0, 1, cx, cy, sc, fov, angle),  color: 'rgba(68, 68, 255, 1)' },
        ];
        lines.forEach(({ a, b, color }) => {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = color;
          ctx.lineWidth   = 1.5;
          ctx.stroke();
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width  * 0.5;
        const cy = canvas.height * 0.5;
        const sc = Math.min(canvas.width, canvas.height) * scale;

        if (showAxes) drawAxes(cx, cy, sc);

        drawRevolution(bunTopProfile, cx, cy, sc, 0.75);
        drawRevolution(bunBotProfile, cx, cy, sc, 0.65);
        ingredients.forEach(ing => drawIngredient(ing, cx, cy, sc));

        // sementes no topo do pão
        [0.3, 1.1, 2.0, 3.5, 4.8, 5.5].forEach(sa => {
          const sa2 = sa + angle * 0.5;
          const sp  = project(Math.cos(sa2) * 0.26, -0.62, Math.sin(sa2) * 0.26, cx, cy, sc, fov, angle);
          ctx.beginPath();
          ctx.ellipse(sp.x, sp.y, 5 * sp.p, 2.5 * sp.p, sa, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(180, 40, 30, ${opacity * 0.50})`;
          ctx.lineWidth   = 1.0;
          ctx.stroke();
        });
      }

      function onFrame(timestamp) {
        if (lastTime > 0) fps = Math.round(1000 / (timestamp - lastTime));
        lastTime = timestamp;

        if (!paused) angle += speed;

        draw();

        document.getElementById('d-fps').textContent   = fps;
        document.getElementById('d-angle').textContent = Math.round((angle * 180 / Math.PI) % 360);

        requestAnimationFrame(onFrame);
      }

      requestAnimationFrame(onFrame);

      // Sliders
      function bindSlider(sliderId, valId, setter, decimals) {
        const sl = document.getElementById(sliderId);
        const vl = document.getElementById(valId);
        sl.addEventListener('input', () => {
          const v = parseFloat(sl.value);
          setter(v);
          vl.textContent = v.toFixed(decimals);
        });
      }

      bindSlider('s-speed',   'v-speed',   v => speed   = v, 3);
      bindSlider('s-scale',   'v-scale',   v => scale   = v, 2);
      bindSlider('s-opacity', 'v-opacity', v => opacity = v, 2);
      bindSlider('s-fov',     'v-fov',     v => fov     = v, 1);

      document.getElementById('btn-pause').addEventListener('click', function () {
        paused = !paused;
        this.textContent = paused ? 'Retomar' : 'Pausar';
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        angle   = 0;
        speed   = DEFAULTS.speed;
        scale   = DEFAULTS.scale;
        opacity = DEFAULTS.opacity;
        fov     = DEFAULTS.fov;

        document.getElementById('s-speed').value    = speed;
        document.getElementById('s-scale').value    = scale;
        document.getElementById('s-opacity').value  = opacity;
        document.getElementById('s-fov').value      = fov;
        document.getElementById('v-speed').textContent   = speed.toFixed(3);
        document.getElementById('v-scale').textContent   = scale.toFixed(2);
        document.getElementById('v-opacity').textContent = opacity.toFixed(2);
        document.getElementById('v-fov').textContent     = fov.toFixed(1);
      });

      document.getElementById('btn-axes').addEventListener('click', function () {
        showAxes = !showAxes;
        this.classList.toggle('btn-active', showAxes);
      });

    })();
  </script>
</body>
</html>
